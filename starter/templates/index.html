<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="header">
    <h1>Sudoku Game</h1>
    <button id="theme-toggle" class="theme-toggle">🌙 Dark</button>
    <button id="leaderboard-btn" class="leaderboard-btn">🏆 Leaderboard</button>
  </div>
  <div id="sudoku-board"></div>
  <div id="leaderboard-display" class="leaderboard-display">
    <h3>🏆 Top 10 Leaderboard</h3>
    <div id="leaderboard-content">Loading...</div>
  </div>
  <div class="controls">
    <div class="difficulty">
      <button class="difficulty-btn" data-difficulty="easy">Easy</button>
      <button class="difficulty-btn active" data-difficulty="medium">Medium</button>
      <button class="difficulty-btn" data-difficulty="hard">Hard</button>
    </div>
    <button id="new-game">New Game</button>
    <button id="check-solution">Check Solution</button>
    <button id="hint">Hint</button>
    <span id="timer">Time: 00:00</span>
    <span id="message"></span>
  </div>

  <!-- Leaderboard Modal -->
  <div id="leaderboard-modal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2>🏆 Top 10 Leaderboard</h2>
      <div id="leaderboard-list">Loading...</div>
    </div>
  </div>

  <!-- Win Modal with Username Input -->
  <div id="win-modal" class="modal">
    <div class="modal-content">
      <h2>🎉 You Won!</h2>
      <p id="win-stats"></p>
      <input type="text" id="username-input" placeholder="Enter your name" maxlength="20">
      <div class="modal-buttons">
        <button id="submit-score">Save Score</button>
        <button id="skip-score">Skip</button>
      </div>
    </div>
  </div>
  <script src="/static/main.js"></script>
</body>
</html>
